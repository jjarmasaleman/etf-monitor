# Repository conventions, enforced on every pull request.
# The patterns below are the single source of truth for the rules:
#   Branches: type/short-description (feature, fix, chore, docs, refactor, test,
#             hotfix), release/x.y.z, develop, master. Lowercase, hyphens.
#             GitHub's revert-<number>-<branch> is allowed.
#   Commits and PR titles: Conventional Commits, type(scope): description,
#             whole first line at most 72 characters. GitHub's Revert "..." is allowed.
name: Conventions

on:
  pull_request:
    branches: [master, develop]
    # "edited" re-runs the check when the PR title is fixed
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  check:
    name: Conventions check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEAD_REF: ${{ github.head_ref }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CONVENTIONAL: '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+$'
      REVERT: '^Revert ".+"$'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check branch name
        run: |
          pattern='^((feature|fix|chore|docs|refactor|test|hotfix)/[a-z0-9]+(-[a-z0-9]+)*|release/[0-9]+\.[0-9]+\.[0-9]+|revert-[0-9]+-.+|develop|master)$'
          if ! printf '%s\n' "$HEAD_REF" | grep -Eq "$pattern"; then
            echo "::error::Branch '$HEAD_REF' is not allowed. Use type/short-description (types: feature fix chore docs refactor test hotfix; lowercase, hyphens), release/x.y.z, develop or master."
            exit 1
          fi

      - name: Check PR title
        run: |
          valid() {
            printf '%s\n' "$1" | grep -Eq "$REVERT" && return 0
            [ "${#1}" -le 72 ] && printf '%s\n' "$1" | grep -Eq "$CONVENTIONAL"
          }
          if ! valid "$PR_TITLE"; then
            echo "::error::PR title '$PR_TITLE' is not valid. Expected type(scope): description, whole line max 72 chars. Types: feat fix docs style refactor perf test build ci chore revert. Example: feat(backend): add EtfPrice entity"
            exit 1
          fi

      # Commits that already entered develop through a checked PR are not checked
      # again: PRs from develop are skipped, and release/* PRs only check the
      # commits made on the release branch itself (not yet in develop).
      - name: Check commit messages
        if: github.head_ref != 'develop'
        run: |
          valid() {
            printf '%s\n' "$1" | grep -Eq "$REVERT" && return 0
            [ "${#1}" -le 72 ] && printf '%s\n' "$1" | grep -Eq "$CONVENTIONAL"
          }
          range="$BASE_SHA..$HEAD_SHA"
          case "$HEAD_REF" in
            release/*) range="origin/develop..$HEAD_SHA" ;;
          esac
          status=0
          while IFS= read -r subject; do
            if ! valid "$subject"; then
              echo "::error::Commit message '$subject' is not valid. Expected type(scope): description, whole line max 72 chars."
              status=1
            fi
          done < <(git log --no-merges --format=%s "$range")
          exit $status
