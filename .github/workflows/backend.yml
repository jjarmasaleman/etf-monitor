name: Backend CI

on:
  push:
    branches: [master, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  # No paths filter on pull_request: a required check that is skipped by a path
  # filter never reports, and the PR could not be merged.
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Backend build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify
